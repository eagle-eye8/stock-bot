name: Daily Stock and News Analysis

on:
  schedule:
    # 月〜金 08:00 JST (日〜木 23:00 UTC) -> 日本株
    - cron: "0 23 * * 0-4"
    # 月〜金 22:30 JST (月〜金 13:30 UTC) -> 米国株
    - cron: "30 13 * * 1-5"
    # 土日 08:00 JST (金土 23:00 UTC) -> 週末ニュース
    - cron: "0 23 * * 5-6"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 競合の原因となる既存のgoogleライブラリを一度アンインストール
          pip uninstall -y google google-cloud-core google-cloud-aiplatform
          # その後、改めてrequirements.txtから強制インストール
          pip install --force-reinstall -r requirements.txt

      # 日本株（月〜金）
      - name: Japan Stock Analysis
        if: github.event.schedule == '0 23 * * 0-4'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python trading_bot.py JP

      # 米国株（月〜金）
      - name: US Stock Analysis
        if: github.event.schedule == '30 13 * * 1-5'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python trading_bot.py US

      # 週末政治トピック（土日）
      - name: Weekend News Analysis
        if: github.event.schedule == '0 23 * * 5-6'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python trading_bot.py WEEKEND
